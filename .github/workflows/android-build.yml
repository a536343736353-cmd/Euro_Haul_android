
name: Build Euro Haul Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Godot project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q Euro_Haul_Offline_Expanded_Project.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.1"

      - name: Create temporary APK signing key
        shell: bash
        run: |
          set -e

          PASSWORD=$(openssl rand -hex 16)
          echo "EUROHAUL_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/eurohaul-release.keystore" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias eurohaul \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Euro Haul, O=Euro Haul, L=Nairobi, C=KE"

          echo "Temporary signing key created."

      - name: Configure Godot project and app icon
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          project = root / "project.godot"
          content = project.read_text()

          icon = root / "icon.svg"
          icon.write_text("""<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="90" fill="#172b3d"/>
          <path d="M55 160h235v175H55z" fill="#e9a52b"/>
          <path d="M290 220h90l77 85v30H290z" fill="#e9a52b"/>
          <path d="M315 240h52l48 53H315z" fill="#b9e0ed"/>
          <circle cx="145" cy="354" r="43" fill="#111820"/>
          <circle cx="145" cy="354" r="19" fill="#d7dce0"/>
          <circle cx="365" cy="354" r="43" fill="#111820"/>
          <circle cx="365" cy="354" r="19" fill="#d7dce0"/>
          <path d="M75 190h190v22H75z" fill="#fff0c9"/>
          </svg>""")

          def set_setting(section, key, value):
              global content
              match = re.search(
                  r"(?ms)^\[" + re.escape(section) + r"\]\s*$.*?(?=^\[|\Z)",
                  content
              )
              line = f'{key}={value}'
              if match:
                  block = match.group(0)
                  pattern = r"(?m)^" + re.escape(key) + r"\s*=.*$"
                  if re.search(pattern, block):
                      block = re.sub(pattern, line, block)
                  else:
                      block = block.rstrip() + "\n" + line + "\n"
                  content = content[:match.start()] + block + content[match.end():]
              else:
                  content += f"\n[{section}]\n{line}\n"

          set_setting("application", "config/icon", '"res://icon.svg"')
          set_setting("rendering", "textures/vram_compression/import_etc2_astc", "true")

          project.write_text(content)
          print("Application icon and ETC2/ASTC configured.")
          PY

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/EuroHaul.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.eurohaul.trucksim"
          package/name="Euro Haul"
          EOF

      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/eurohaul-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: eurohaul
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.EUROHAUL_KEYSTORE_PASSWORD }}
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2
          godot_export_templates_download_url: https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2
          relative_project_path: ./${{ env.PROJECT_DIR }}
          presets_to_export: Android
          use_preset_export_path: true

      - name: Find and prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/build"

          APK=$(find "$HOME/.local/share/godot/builds" "$PROJECT_DIR/build" \
            -type f -name "*.apk" -print -quit 2>/dev/null || true)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            find "$PROJECT_DIR" -name "*.apk" -type f
            exit 1
          fi

          cp "$APK" "$PROJECT_DIR/build/EuroHaul.apk"

          echo "APK generated successfully:"
          ls -lh "$PROJECT_DIR/build/EuroHaul.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/EuroHaul.apk
          if-no-files-found: error
          retention-days: 7
