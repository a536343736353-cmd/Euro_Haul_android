
name: Build Euro Haul Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Godot project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q Euro_Haul_Offline_Expanded_Project.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.1"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          adb version

      - name: Create Android export preset
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/EuroHaul.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.eurohaul.trucksim"
          package/name="Euro Haul"
          EOF

      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./${{ env.PROJECT_DIR }}
          presets_to_export: Android
          use_preset_export_path: true

      - name: Check APK output
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/build/EuroHaul.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -name "*.apk" -type f
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/EuroHaul.apk
          if-no-files-found: error
          retention-days: 7
 
