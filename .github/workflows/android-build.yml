
name: Build Euro Haul Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Godot project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q Euro_Haul_Offline_Expanded_Project.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.1"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          adb version

      - name: Configure Godot Android project
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"]) / "project.godot"
          content = project.read_text()

          setting = "textures/vram_compression/import_etc2_astc"
          pattern = re.compile(
              r"(?m)^" + re.escape(setting) + r"\s*=.*$"
          )

          if pattern.search(content):
              content = pattern.sub(setting + "=true", content)
          elif "[rendering]" in content:
              content = content.replace(
                  "[rendering]",
                  "[rendering]\n" + setting + "=true",
                  1
              )
          else:
              content += "\n[rendering]\n" + setting + "=true\n"

          project.write_text(content)
          print("Enabled ETC2/ASTC texture compression.")
          PY

          mkdir -p "$PROJECT_DIR/build"

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/EuroHaul.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.eurohaul.trucksim"
          package/name="Euro Haul"
          EOF

      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.2
          godot_export_templates_download_url: https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.2
          relative_project_path: ./${{ env.PROJECT_DIR }}
          presets_to_export: Android
          use_preset_export_path: true

      - name: Find and prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/build"

          APK=$(find "$HOME/.local/share/godot/builds" "$PROJECT_DIR/build" \
            -type f -name "*.apk" -print -quit 2>/dev/null || true)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            find "$PROJECT_DIR" -name "*.apk" -type f
            exit 1
          fi

          if [ "$APK" != "$PROJECT_DIR/build/EuroHaul.apk" ]; then
            cp "$APK" "$PROJECT_DIR/build/EuroHaul.apk"
          fi

          echo "APK successfully found:"
          ls -lh "$PROJECT_DIR/build/EuroHaul.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/EuroHaul.apk
          if-no-files-found: error
          retention-days: 7
          
