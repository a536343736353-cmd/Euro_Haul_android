name: Build Euro Haul Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract game ZIP
        run: |
          mkdir project
          unzip -q Euro_Haul_Offline_Expanded_Project.zip -d project
          test -f project/project.godot

      - name: Create Android export preset
        run: |
          cat > project/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/EuroHaul.apk"
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.eurohaul.trucksim"
          package/name="Euro Haul"
          EOF

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Build APK with Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.7.2/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./project
          presets_to_export: Android
          use_preset_export_path: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-APK
          path: project/build/EuroHaul.apk
